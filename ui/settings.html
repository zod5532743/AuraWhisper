<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body style="padding: 20px; display: block; height: auto; overflow: auto; background: transparent !important;">
    <div class="settings-window">
        <header style="margin-bottom: 32px;">
            <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #fff;">Settings</h2>
        </header>

        <div class="section-title">General</div>
        <div class="settings-card">
            <div class="setting-row">
                <div class="setting-label">
                    <h4>Microphone</h4>
                    <p>Input device for recording</p>
                </div>
                <select id="mic-select" style="width: 200px;"></select>
            </div>
            <div class="setting-row">
                <div class="setting-label">
                    <h4>Shortcut</h4>
                    <p>Global key to start/stop</p>
                </div>
                <input type="text" id="hotkey-display" class="hotkey-input" style="width: 200px; text-align: center; color: var(--accent-primary); font-weight: 700; font-family: 'JetBrains Mono';" readonly>
            </div>
        </div>

        <div class="section-title">AI Engine</div>
        <div class="settings-card">
            <div class="setting-row">
                <div class="setting-label">
                    <h4>Whisper Model</h4>
                    <p>Accuracy vs Performance</p>
                </div>
                <select id="model-size-select" style="width: 150px;">
                    <option value="tiny">Tiny (Fastest)</option>
                    <option value="base">Base</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large-v3">Large-v3</option>
                </select>
            </div>
            <div class="setting-row">
                <div class="setting-label">
                    <h4>Language</h4>
                    <p>Detection target</p>
                </div>
                <select id="language-select" style="width: 150px;">
                    <option value="ja">Japanese</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="section-title">Polishing</div>
        <div class="settings-card">
            <div class="setting-row">
                <div class="setting-label">
                    <h4>AI Refinement</h4>
                    <p>Fix grammar with Ollama</p>
                </div>
                <select id="ollama-enabled-select" style="width: 100px;">
                    <option value="true">On</option>
                    <option value="false">Off</option>
                </select>
            </div>
            <div class="setting-row" id="ollama-model-row">
                <div class="setting-label">
                    <h4>Ollama Model</h4>
                    <p>Local LLM to use</p>
                </div>
                <input type="text" id="ollama-model-input" placeholder="qwen2.5-coder:14b" style="width: 180px;">
            </div>
        </div>

        <div style="margin-top: 40px; display: flex; gap: 12px;">
            <button class="btn btn-primary" id="save-settings" style="flex: 2;">Apply Changes</button>
            <button class="btn btn-secondary" id="close-window" style="flex: 1;">Cancel</button>
        </div>

        <div style="margin-top: 24px; text-align: center;">
            <a href="https://www.buymeacoffee.com/YOUR_USERNAME" target="_blank" style="color: var(--text-secondary); text-decoration: none; font-size: 12px; opacity: 0.6; transition: opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">
                ❤️ Support Development
            </a>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        const micSelect = document.getElementById('mic-select');
        const modelSizeSelect = document.getElementById('model-size-select');
        const languageSelect = document.getElementById('language-select');
        const ollamaEnabledSelect = document.getElementById('ollama-enabled-select');
        const ollamaModelInput = document.getElementById('ollama-model-input');
        const ollamaModelRow = document.getElementById('ollama-model-row');
        const hotkeyDisplay = document.getElementById('hotkey-display');
        
        let currentConfig = {};
        let isRecordingHotkey = false;

        async function init() {
            try {
                // Fetch devices
                const devRes = await fetch('http://127.0.0.1:8000/devices');
                const devices = await devRes.json();
                micSelect.innerHTML = '';
                devices.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.text = d.name.length > 25 ? d.name.substring(0, 25) + '...' : d.name;
                    micSelect.appendChild(opt);
                });
                
                // Fetch config
                const confRes = await fetch('http://127.0.0.1:8000/config');
                currentConfig = await confRes.json();
                
                micSelect.value = currentConfig.device_index || 0;
                modelSizeSelect.value = currentConfig.model_size || 'medium';
                languageSelect.value = currentConfig.language || 'ja';
                ollamaEnabledSelect.value = currentConfig.use_ollama !== undefined ? currentConfig.use_ollama.toString() : 'false';
                ollamaModelInput.value = currentConfig.ollama_model || 'qwen2.5-coder:14b';
                hotkeyDisplay.value = currentConfig.hotkey || 'Alt+Shift+U';

                updateOllamaVisibility();
            } catch (err) { console.error(err); }
        }

        function updateOllamaVisibility() {
            const isEnabled = ollamaEnabledSelect.value === 'true';
            ollamaModelRow.style.display = isEnabled ? 'flex' : 'none';
        }

        ollamaEnabledSelect.onchange = updateOllamaVisibility;

        hotkeyDisplay.onclick = () => {
            isRecordingHotkey = true;
            hotkeyDisplay.value = 'Press keys...';
            hotkeyDisplay.style.borderColor = 'var(--accent-primary)';
            hotkeyDisplay.style.background = 'rgba(0, 113, 227, 0.1)';
        };

        window.onkeydown = (e) => {
            if (!isRecordingHotkey) return;
            e.preventDefault();
            if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;

            const keys = [];
            if (e.ctrlKey) keys.push('Ctrl');
            if (e.altKey) keys.push('Alt');
            if (e.shiftKey) keys.push('Shift');
            if (e.metaKey) keys.push('Cmd');
            
            let key = e.key;
            if (key === ' ') key = 'Space';
            if (key.length === 1) key = key.toUpperCase();
            keys.push(key);
            
            hotkeyDisplay.value = keys.join('+');
            hotkeyDisplay.style.borderColor = '';
            hotkeyDisplay.style.background = '';
            isRecordingHotkey = false;
        };

        document.getElementById('save-settings').onclick = async () => {
            try {
                const newConfig = {
                    ...currentConfig,
                    device_index: parseInt(micSelect.value),
                    model_size: modelSizeSelect.value,
                    language: languageSelect.value,
                    hotkey: hotkeyDisplay.value,
                    use_ollama: ollamaEnabledSelect.value === 'true',
                    ollama_model: ollamaModelInput.value
                };
                
                await fetch('http://127.0.0.1:8000/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newConfig)
                });
                
                ipcRenderer.send('config-updated');
                window.close();
            } catch (err) {
                alert('Save failed: ' + err.message);
            }
        };

        document.getElementById('close-window').onclick = () => window.close();
        init();
    </script>
</body>
</html>
