<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AuraWhisper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="app-container">
        <canvas id="waveform-canvas"></canvas>
        <div class="main-content" style="display:flex; align-items:center; width:100%; height:100%; position:relative; z-index:10;">
            <div id="recording-indicator" class="pulse hide"></div>
            
            <div class="text-container" style="display:flex; flex-direction:column; justify-content:center; margin-left:12px; flex:1;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                    <div id="mode-badge" class="mode-badge-inline">General</div>
                    <div id="ai-toggle" class="ai-pill" title="Toggle AI Refinement">
                        <span class="pill-dot"></span>
                        <span class="pill-label">AI ON</span>
                    </div>
                </div>
                <div id="status-text" class="fade-up">Ready</div>
                <div id="sub-status" class="fade-up">Detecting...</div>
            </div>

            <div class="settings-btn" id="open-settings-btn" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>
        
        <button id="retry-btn" class="hide" style="position:absolute; bottom:4px; right:48px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:2px 10px; border-radius:20px; font-size:10px; z-index:20; cursor:pointer;">Retry Connection</button>

        <!-- Ollama Guide Modal -->
        <div id="ollama-guide" class="modal-overlay hide">
            <div class="modal-card">
                <h3>Ollama を活用して、文章を磨き上げる</h3>
                <p>高度な校正機能（AI ON）を使用するには、無料の AI エンジン <b>Ollama</b> が必要です。インストールすると、驚くほど自然な文章へ自動的に整えてくれるようになります。</p>
                <div style="margin: 20px 0; background: rgba(0,113,227,0.1); padding: 15px; border-radius: 12px; font-size: 13px;">
                    <ol style="padding-left: 20px; color: rgba(255,255,255,0.8);">
                        <li><a href="#" onclick="shell.openExternal('https://ollama.com/download')">Ollama をダウンロード</a> して実行</li>
                        <li>アプリを再起動、または AI ON を再度クリック</li>
                    </ol>
                </div>
                <div style="display:flex; justify-content:center; gap:12px;">
                    <button class="btn btn-s" onclick="document.getElementById('ollama-guide').classList.add('hide')">後で設定する</button>
                    <button class="btn btn-p" onclick="shell.openExternal('https://ollama.com/download')">今すぐ入手</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        // --- Sound Feedback ---
        class AudioFeedback {
            constructor() {
                this.audioCtx = null;
                this.unlock();
            }
            unlock() {
                const unlockHandler = () => {
                    if (!this.audioCtx) {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                };
                document.addEventListener('mousedown', unlockHandler, { once: true });
            }
            
            async playPremiumSound(type) {
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
                
                const now = this.audioCtx.currentTime;
                const masterGain = this.audioCtx.createGain();
                masterGain.connect(this.audioCtx.destination);
                masterGain.gain.setValueAtTime(0, now);
                masterGain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                masterGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                if (type === 'start') {
                    // Two-tone rising "ding"
                    this.createTone(880, now, 0.4, masterGain);
                    this.createTone(1320, now + 0.05, 0.3, masterGain);
                } else {
                    // Two-tone falling "dong"
                    this.createTone(660, now, 0.4, masterGain);
                    this.createTone(440, now + 0.05, 0.3, masterGain);
                }
            }

            createTone(freq, startTime, duration, target) {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);
                
                gain.gain.setValueAtTime(0.5, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                
                osc.connect(gain);
                gain.connect(target);
                osc.start(startTime);
                osc.stop(startTime + duration);
            }

            playStart() { this.playPremiumSound('start'); }
            playStop() { this.playPremiumSound('stop'); }
        }

        const audioFeedback = new AudioFeedback();
        document.addEventListener('mousedown', () => audioFeedback.init(), { once: true });

        // --- Classical Waveform Visualizer (差し戻し & 強化) ---
        class WaveformVisualizer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.volume = 0;
                this.targetVolume = 0;
                this.phase = 0;
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.animate();
            }
            resize() {
                const dpr = window.devicePixelRatio || 1;
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            setVolume(v) { this.targetVolume = Math.max(0.02, v); }
            animate() {
                const w = this.canvas.width / (window.devicePixelRatio || 1);
                const h = this.canvas.height / (window.devicePixelRatio || 1);
                this.ctx.clearRect(0, 0, w, h);
                
                this.volume += (this.targetVolume - this.volume) * 0.1; // More smooth
                this.phase += 0.04 + (this.volume * 0.05); // Slowed down significantly

                // 以前の好評だった「3本の重なる波」 - ゆったりとした速度倍率
                this.drawWave(w, h, 0.4, '#0071e3', 0.5);
                this.drawWave(w, h, 0.2, '#af52de', 0.8);
                this.drawWave(w, h, 0.1, '#ff3b30', 1.0);
                
                requestAnimationFrame(() => this.animate());
            }
            drawWave(w, h, opacity, color, speed) {
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.strokeStyle = color;
                this.ctx.globalAlpha = opacity;
                this.ctx.lineWidth = 3;
                this.ctx.lineCap = 'round';
                
                const amplitude = (h * 0.25) * this.volume; // 振幅を3分の2程度に抑制 (0.4 -> 0.25)
                for (let x = 0; x <= w; x += 5) {
                    const sine = Math.sin(x * 0.03 + this.phase * speed);
                    const envelope = Math.sin((x / w) * Math.PI); 
                    const y = h / 2 + sine * amplitude * envelope;
                    if (x === 0) this.ctx.moveTo(x, y);
                    else this.ctx.lineTo(x, y);
                }
                this.ctx.stroke();
                this.ctx.restore();
            }
        }

        const canvas = document.getElementById('waveform-canvas');
        const visualizer = new WaveformVisualizer(canvas);

        const statusText = document.getElementById('status-text');
        const subStatus = document.getElementById('sub-status');
        const indicator = document.getElementById('recording-indicator');
        const appContainer = document.getElementById('app-container');
        
        let lastStatus = '';
        let lastStatusType = '';
        let offlineCount = 0;

        function setStatus(main, sub, type) {
            if (lastStatus === main && lastStatusType === type) return;
            
            if (type === 'recording' && lastStatusType !== 'recording') {
                audioFeedback.playStart();
            } else if (lastStatusType === 'recording' && type !== 'recording') {
                audioFeedback.playStop();
            }

            if (lastStatusType === 'analyzing' && type === 'ready') {
                showNotification('AuraWhisper', 'Transcription & refinement complete!');
            }

            lastStatus = main;
            lastStatusType = type;

            statusText.classList.remove('fade-up');
            subStatus.classList.remove('fade-up');
            void statusText.offsetWidth; 
            statusText.classList.add('fade-up');
            subStatus.classList.add('fade-up');

            statusText.innerText = main;
            subStatus.innerText = sub;

            if (type === 'recording') {
                indicator.classList.remove('hide');
                appContainer.classList.add('recording-active');
            } else {
                indicator.classList.add('hide');
                appContainer.classList.remove('recording-active');
            }
        }

        async function showNotification(title, body) {
            const confRes = await fetch('http://127.0.0.1:8000/config');
            const config = await confRes.json();
            if (config.notifications === false) return;

            new Notification(title, { body, silent: true });
        }
        
        let allModes = [];
        let currentConfig = {};

        async function fetchModesAndConfig() {
            try {
                const [cRes, mRes] = await Promise.all([
                    fetch('http://127.0.0.1:8000/config'),
                    fetch('http://127.0.0.1:8000/modes')
                ]);
                currentConfig = await cRes.json();
                allModes = await mRes.json();
                
                const activeMode = allModes.find(m => m.id === currentConfig.active_mode_id) || allModes[0];
                document.getElementById('mode-badge').innerText = activeMode ? activeMode.name : 'Default';
                
                updateAIPillUI(currentConfig.use_ollama);
            } catch (e) {}
        }

        function updateAIPillUI(enabled) {
            const pill = document.getElementById('ai-toggle');
            if (enabled) {
                pill.classList.remove('ai-off');
                pill.querySelector('.pill-label').innerText = 'AI ON';
            } else {
                pill.classList.add('ai-off');
                pill.querySelector('.pill-label').innerText = 'AI OFF';
            }
        }

        async function toggleAI() {
            // Check Ollama status if trying to turn ON
            if (!currentConfig.use_ollama) {
                try {
                    const res = await fetch('http://127.0.0.1:8000/status');
                    const data = await res.json();
                    if (!data.ollama_connected) {
                        document.getElementById('ollama-guide').classList.remove('hide');
                        return;
                    }
                } catch (e) {
                    console.error('Status check failed:', e);
                }
            }

            currentConfig.use_ollama = !currentConfig.use_ollama;
            updateAIPillUI(currentConfig.use_ollama);
            
            await fetch('http://127.0.0.1:8000/config', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(currentConfig)
            });
            ipcRenderer.send('config-updated');
        }

        document.getElementById('ai-toggle').onclick = toggleAI;

        async function cycleMode() {
            if (allModes.length === 0) return;
            
            const currentIndex = allModes.findIndex(m => m.id === currentConfig.active_mode_id);
            const nextIndex = (currentIndex + 1) % allModes.length;
            const nextMode = allModes[nextIndex];
            
            currentConfig.active_mode_id = nextMode.id;
            document.getElementById('mode-badge').innerText = nextMode.name;
            
            // Save to backend
            await fetch('http://127.0.0.1:8000/config', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(currentConfig)
            });
            ipcRenderer.send('config-updated');
        }

        document.getElementById('mode-badge').onclick = () => {
            ipcRenderer.send('show-mode-menu');
        };

        ipcRenderer.on('mode-updated', (event, mode) => {
            document.getElementById('mode-badge').innerText = mode.name;
            fetchModesAndConfig(); // Sync local state
        });

        ipcRenderer.on('config-updated', () => {
            console.log('Config update detected, refreshing...');
            fetchModesAndConfig();
            updateStatus(true); // Force immediate update
        });

        fetchModesAndConfig();

        async function updateStatus(force = false) {
            try {
                const res = await fetch('http://127.0.0.1:8000/status');
                const data = await res.json();
                
                if (data.status === 'recording') {
                    offlineCount = 0;
                    document.getElementById('retry-btn').classList.add('hide');
                    setStatus('Listening...', 'Speak naturally', 'recording');
                    visualizer.setVolume(data.volume || 0.1);
                } else if (data.status === 'analyzing') {
                    offlineCount = 0;
                    setStatus('Refining...', 'AI is polishing your text', 'analyzing');
                    visualizer.setVolume(0.05);
                } else if (data.status === 'reloading') {
                    offlineCount = 0;
                    setStatus('Synchronizing...', 'Applying new settings', 'loading');
                    visualizer.setVolume(0.02);
                } else if (data.status === 'ready') {
                    offlineCount = 0;
                    // Update current mode name in case it changed in settings
                    // fetchModesAndConfig(); // Already handled by config-updated listener
                    
                    const config = currentConfig;
                    
                    // Apply window style
                    const container = document.getElementById('app-container');
                    if (config.window_style === 'mini') {
                        container.classList.add('container-mini');
                        ipcRenderer.send('resize-window', { width: 320, height: 120 });
                    } else {
                        container.classList.remove('container-mini');
                        ipcRenderer.send('resize-window', { width: 450, height: 200 });
                    }

                    setStatus('Ready', `Press ${config.hotkey || 'Alt+Shift+S'}`, 'ready');
                    visualizer.setVolume(0.02);
                } else if (data.status === 'loading') {
                    offlineCount = 0;
                    setStatus('Initializing...', 'Loading AI models', 'loading');
                    visualizer.setVolume(0.02);
                }
            } catch (err) {
                offlineCount++;
                // Only show offline if it persists for more than 3 checks (~1.2s)
                if (offlineCount > 3 || force) {
                    setStatus('Offline', 'Backend not connected', 'error');
                    document.getElementById('retry-btn').classList.remove('hide');
                    visualizer.setVolume(0);
                } else {
                    // Temporary glitch, show syncing
                    setStatus('Synchronizing...', 'Reconnecting to AI engine', 'loading');
                }
            }
        }

        document.getElementById('retry-btn').onclick = () => {
            ipcRenderer.send('relaunch-app');
        };

        let statusTimer = setInterval(updateStatus, 400);

        document.getElementById('open-settings-btn').onclick = () => {
            ipcRenderer.send('open-settings');
        };

        appContainer.oncontextmenu = (e) => {
            e.preventDefault();
            ipcRenderer.send('show-context-menu');
        };
    </script>
</body>
</html>
